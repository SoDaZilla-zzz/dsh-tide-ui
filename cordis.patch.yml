# tide skin bundle patch: inserts its dshClient row into the web plugin roster.
# The bundle is the official dsh plugin shape — install it with
# `dsh plugin --profile <name> add <path-or-git-url>`; mutual exclusion between
# skins is managed by the home-layer managed section (see switch-skin script).
- insert:
    - id: ui-skin-tide
      name: 'dsh-tide-ui'
